
name: Build OpenRevo Dev for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build OpenRevo Dev
    runs-on: windows-latest

    steps:
      # 1. 获取原作者 dev 分支
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: faintonce/open-revo
          ref: dev
          fetch-depth: 1
          persist-credentials: false

      # 2. 安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. 安装项目指定版本的 pnpm，绕过 action-setup self-installer
      - name: Setup pnpm
        shell: pwsh
        run: |
          npm install --global pnpm@10.32.1
          pnpm --version

      # 4. 安装 Rust MSVC
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 5. 缓存 Rust 依赖
      - name: Cache Rust Dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # 6. 安装前端依赖
      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      # 8. 编译独立 EXE，不生成安装包
      - name: Build Standalone Executable
        run: pnpm tauri build --no-bundle

      # 9. 打包 7z 并计算 SHA256
      - name: Prepare 7z Artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # 获取版本号
          $ver = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version

          # 获取实际源码提交号
          $commit = (git rev-parse HEAD).Trim()
          $shortCommit = $commit.Substring(0, 7)

          Write-Host "Version: $ver"
          Write-Host "Commit: $commit"

          # 检查 EXE
          $srcExe = "src-tauri/target/release/open-revo.exe"

          if (!(Test-Path $srcExe)) {
            throw "Build failed: EXE not found"
          }

          # 创建临时目录
          $stageDir = "build_stage"
          $distDir = "dist_artifacts"

          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          Copy-Item $srcExe "$stageDir/OpenRevo.exe" -Force

          # 查找 7-Zip
          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source

          if (!$sevenZip) {
            $sevenZip = "$env:ProgramFiles/7-Zip/7z.exe"
          }

          if (!(Test-Path $sevenZip)) {
            throw "7-Zip executable not found"
          }

          # 生成 7z
          $archiveName = "OpenRevo-dev-v$ver-$shortCommit-Windows-x64.7z"
          $archivePath = "$distDir/$archiveName"

          & $sevenZip a -t7z -mx=9 "$archivePath" "$stageDir/OpenRevo.exe"

          if ($LASTEXITCODE -ne 0) {
            throw "7z archive creation failed"
          }

          # 验证压缩包
          & $sevenZip t "$archivePath"

          if ($LASTEXITCODE -ne 0) {
            throw "7z archive verification failed"
          }

          # 生成 SHA256
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archivePath).Hash.ToLowerInvariant()

          "$hash  $archiveName" |
            Set-Content "$distDir/checksums.txt" -Encoding ascii

          # 记录源码版本
          @"
          Version: $ver
          Branch: dev
          Commit: $commit
          Archive: $archiveName
          SHA256: $hash
          "@ | Set-Content "$distDir/source-info.txt" -Encoding utf8

          Write-Host "Build completed successfully!" -ForegroundColor Green
          Write-Host "Archive: $archiveName"
          Write-Host "SHA256: $hash"

      # 10. 上传到 GitHub Actions Artifacts
      - name: Upload 7z Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRevo-dev-Windows-x64
          path: |
            dist_artifacts/*.7z
            dist_artifacts/checksums.txt
            dist_artifacts/source-info.txt
          if-no-files-found: error
          retention-days: 14

