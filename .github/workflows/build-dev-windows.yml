name: Build OpenRevo Dev for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build OpenRevo Dev
    runs-on: windows-latest

    steps:
      # 1. 获取原作者 dev 分支
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: faintonce/open-revo
          ref: dev
          fetch-depth: 1
          persist-credentials: false

      # 2. 安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. 安装项目指定版本的 pnpm，绕过 action-setup self-installer
      - name: Setup pnpm
        shell: pwsh
        run: |
          npm install --global pnpm@10.32.1
          pnpm --version

      # 4. 安装 Rust MSVC
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 5. 缓存 Rust 依赖
      - name: Cache Rust Dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # 6. 安装前端依赖
      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      # 8. 编译独立 EXE，不生成安装包
      - name: Build Standalone Executable
        run: pnpm tauri build --no-bundle

      # 9. 准备 EXE 并生成压缩包名
      - name: Prepare EXE Artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # 获取版本号
          $ver = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version

          # 获取实际源码提交号
          $commit = (git rev-parse HEAD).Trim()
          $shortCommit = $commit.Substring(0, 7)

          Write-Host "Version: $ver"
          Write-Host "Commit: $commit"

          # 检查 EXE
          $srcExe = "src-tauri/target/release/open-revo.exe"
          if (!(Test-Path $srcExe)) {
            throw "Build failed: EXE not found"
          }

          # 创建输出目录，EXE 统一命名为 open-revo.exe
          $distDir = "dist_artifacts"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          Copy-Item $srcExe "$distDir/open-revo.exe" -Force

          # 压缩包名：open-revo-<版本>-<短提交>.zip
          $zipName = "open-revo-$ver-$shortCommit.zip"
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "ZIP: $zipName"

      # 10. 压缩并上传 zip（内含 open-revo.exe）
      - name: Upload ZIP Artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Compress-Archive -Path "dist_artifacts/open-revo.exe" -DestinationPath "dist_artifacts/$env:ZIP_NAME" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: dist_artifacts/${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 14
